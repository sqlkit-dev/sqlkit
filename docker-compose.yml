services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: rayhan
      POSTGRES_PASSWORD: rayhan123
      POSTGRES_DB: tinyorm_test
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rayhan -d tinyorm_test"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
